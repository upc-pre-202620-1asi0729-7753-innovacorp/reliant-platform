# Production profile
spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.show-sql=false
# The schema is created and kept up to date by Hibernate on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# JWT secret must be provided as an environment variable in production.
authorization.jwt.secret=${JWT_SECRET}

# Comma-separated origins allowed to call the API (the deployed web application).
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
