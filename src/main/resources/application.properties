# Spring Application Name
spring.application.name=Reliant Platform
# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/reliant-os?useSSL=true&requireSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Spring Data JPA Configuration
spring.jpa.show-sql=false
# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.innovacorp.reliant.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
# Application Information for Documentation
documentation.application.description=Reliant Platform RESTful API, built with DDD and CQRS, for monitoring and tracing HVOF thermal spray processes.
documentation.application.version=0.1.0
# CORS
application.cors.allowed-origins=http://localhost:4200