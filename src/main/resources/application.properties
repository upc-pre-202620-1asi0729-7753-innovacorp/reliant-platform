spring.application.name=Reliant Platform
spring.profiles.default=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=com.innovacorp.reliant.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
documentation.application.description=@project.description@
documentation.application.version=@project.version@
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.threads.virtual.enabled=true
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}